name: Prosperity Bank
kind: company
description: >-
  Prosperity Bank is a Texas-chartered commercial bank (member FDIC, NMLS ID
  466414) and the banking subsidiary of Prosperity Bancshares, Inc. (NYSE: PB),
  a Houston, Texas based regional financial holding company with roughly $37-43
  billion in total assets and 300-plus full-service branches across Texas and
  central Oklahoma. It offers consumer and commercial banking, treasury
  management, mortgage, and wealth services, and has grown largely through
  acquisitions (LegacyTexas, Lone Star State Bancshares, American Bank Holding,
  Southwest Bancshares, Stellar Bancorp). On open finance, Prosperity Bank
  operates no first-party public developer portal or documented API: developer.
  and api. subdomains do not resolve, and no /developers or /api pages exist.
  Consumer-permissioned account and transaction data is reachable only through
  third-party aggregators (Finicity/Mastercard Open Banking, Plaid, and
  similar), not a directly published bank API. No FDX-conformant data-access API
  or CFPB Section 1033 posture is publicly documented by the bank as of this
  review.
